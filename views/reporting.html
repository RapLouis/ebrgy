<div class="space-y-6">
    <div class="flex items-center justify-between pb-4">
        <div>
            <h2 class="text-2xl font-black text-slate-900 mt-1">Hazard Reporting & Complaint Center</h2>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Submit New Hazard Report
            </h3>
            <form id="reportForm" onsubmit="handleReportSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Resident Full Name *</label>
                        <input type="text" id="reporterName" required placeholder="e.g. Maria Santos" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contact Number *</label>
                        <input type="tel" id="reporterPhone" required placeholder="0917XXXXXXX" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Issue Category *</label>
                        <select id="reportCategory" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                            <option value="">Select Category...</option>
                            <option value="Electrical & Power Lines">Electrical Hazard / Cable Wire Risk</option>
                            <option value="Road & Canal Drainage">Flooding / Broken Canal Drainage</option>
                            <option value="Public Noise Complaint">Public Noise / Nuisance</option>
                            <option value="Garbage & Sanitation">Uncollected Waste / Sanitation Risk</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Specific Location / Purok *</label>
                        <input type="text" id="reportLocation" required placeholder="e.g. Purok 4 near Chapel" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Detailed Description *</label>
                    <textarea id="reportDescription" rows="3" required placeholder="Provide concise details about the hazard..." class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm py-3 rounded-lg shadow transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Submit Incident Report
                </button>
            </form>
        </div>

        <div class="lg:col-span-5 bg-slate-900 text-white rounded-2xl shadow-sm p-6 flex flex-col justify-between">
            <div>
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-route text-brand-400"></i> Track Incident Status
                </h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="trackInput" placeholder="e.g. BRGY-2026-1001" class="flex-1 bg-slate-800 border border-slate-700 text-white px-3.5 py-2 rounded-lg text-sm uppercase tracking-wider focus:outline-none">
                    <button onclick="trackComplaint()" class="bg-brand-500 hover:bg-brand-600 px-4 py-2 rounded-lg text-sm font-bold transition-all">Track</button>
                </div>
                <div id="trackingResult" class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 min-h-[160px]">
                    <p class="text-slate-400 text-xs text-center py-6">Enter tracking ID above or click sample code.</p>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t border-slate-800">
                <div class="text-xs text-slate-400 mb-2 font-medium">Try Test Tracking Codes:</div>
                <div class="flex gap-2 text-xs">
                    <button onclick="quickTrack('BRGY-2026-1001')" class="bg-slate-800 hover:bg-slate-700 text-brand-300 font-mono px-2.5 py-1 rounded border border-slate-700">BRGY-2026-1001</button>
                    <button onclick="quickTrack('BRGY-2026-1002')" class="bg-slate-800 hover:bg-slate-700 text-brand-300 font-mono px-2.5 py-1 rounded border border-slate-700">BRGY-2026-1002</button>
                </div>
            </div>
        </div>
    </div>
</div>
