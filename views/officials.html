<div class="space-y-8">
    <!-- HEADER -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
        <div>
            <span class="text-xs font-bold uppercase tracking-wider text-brand-600 bg-brand-50 px-2.5 py-1 rounded">Barangay Hall Desk</span>
            <h2 class="text-2xl font-black text-slate-900 mt-1">Barangay Duty Schedule & Consultations</h2>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openWeeklyRosterModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 transition-all flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-table-cells text-sm text-slate-500"></i> Full Weekly Roster Modal
            </button>
            <button onclick="openAppointmentModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-calendar-plus text-sm"></i> Book an Appointment
            </button>
        </div>
    </div>

    <!-- REAL-TIME DUTY MONITOR CARD -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
            <div>
                <div class="flex items-center gap-2">
                    <h3 class="text-lg font-bold text-slate-900">Active Shift Guaranteed</h3>
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Min 2 Officials On-Duty
                    </span>
                </div>
                <p class="text-slate-500 text-sm mt-1">Real-time duty monitor based on local time.</p>
            </div>
            <div id="shiftClock" class="bg-slate-100 px-4 py-2 rounded-xl text-right">
                <div class="text-xs text-slate-500 font-semibold uppercase">Current Shift Time</div>
                <div id="currentTimeStr" class="text-sm font-bold text-brand-700">Loading...</div>
            </div>
        </div>

        <div class="mt-6">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Currently On Active Duty</h4>
            <div id="currentDutyCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>
</div>
